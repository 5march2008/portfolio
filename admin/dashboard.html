<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubaib Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #071317;
      color: #eef8f4;
    }

    header {
      padding: 22px 6%;
      border-bottom: 1px solid #20383e;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 24px;
    }

    header p {
      color: #8faab1;
      margin-top: 5px;
      font-size: 13px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      cursor: pointer;
      font-weight: 700;
    }

    #logoutBtn {
      background: #263c42;
      color: white;
    }

    main {
      width: min(1100px, 92%);
      margin: 40px auto;
    }

    .welcome {
      padding: 30px;
      border: 1px solid #23434a;
      border-radius: 20px;
      background: #0b1c21;
    }

    .welcome h2 {
      margin-bottom: 10px;
    }

    .welcome p {
      color: #9eb6bd;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .card {
      padding: 25px;
      border-radius: 18px;
      background: #0d2025;
      border: 1px solid #29434a;
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card p {
      color: #8faab1;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <div>
      <h1>🧬 Hubaib Admin</h1>
      <p>Biotechnology Portfolio Management</p>
    </div>

    <button id="logoutBtn">Logout</button>
  </header>

  <main>

    <section class="welcome">
      <h2>Welcome to your dashboard</h2>
      <p>
        You are successfully signed in. From here you will manage
        certificates and projects on your portfolio.
      </p>
    </section>

    <section class="cards">

      <div class="card">
        <h3>🏆 Certificates</h3>
        <p>Add, edit and remove certificates.</p>
      </div>

      <div class="card">
        <h3>🧬 Projects</h3>
        <p>Manage your biotechnology projects.</p>
      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://kenpaoyjbicbvsogecmg.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ftendUcY6moUA8ty4w3dfA_HMEqFD7p";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    async function checkLogin() {
      const { data } = await supabaseClient.auth.getSession();

      if (!data.session) {
        window.location.href = "index.html";
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    });

    checkLogin();
  </script>

</body>
</html>

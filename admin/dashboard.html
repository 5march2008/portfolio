<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubaib Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #071317;
      color: #eef8f4;
    }

    header {
      padding: 22px 6%;
      border-bottom: 1px solid #20383e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    h1 {
      font-size: 24px;
    }

    header p,
    .muted {
      color: #9eb6bd;
      font-size: 14px;
      margin-top: 6px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
    }

    #logoutBtn {
      background: #263c42;
      color: white;
    }

    main {
      width: min(1100px, 92%);
      margin: 35px auto;
    }

    .panel {
      padding: 28px;
      margin-bottom: 25px;
      border: 1px solid #23434a;
      border-radius: 20px;
      background: #0b1c21;
    }

    h2 {
      margin-bottom: 20px;
      color: #5bdc82;
    }

    form {
      display: grid;
      gap: 15px;
    }

    label {
      display: grid;
      gap: 7px;
      color: #c9dadd;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #29434a;
      border-radius: 10px;
      background: #0d2025;
      color: white;
      font: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #5bdc82;
    }

    .save-btn {
      background: linear-gradient(135deg, #3fa34d, #5bdc82);
      color: #071317;
    }

    .message {
      min-height: 20px;
      color: #8ed9ff;
    }

    .item-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .item-card {
      padding: 20px;
      border: 1px solid #29434a;
      border-radius: 15px;
      background: #0d2025;
    }

    .item-card img {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 15px;
      background: #071317;
    }

    .item-card h3 {
      margin-bottom: 8px;
    }

    .item-card p {
      color: #9eb6bd;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .item-card a {
      color: #8ed9ff;
      display: inline-block;
      margin: 8px 0 15px;
    }

    .delete-btn {
      background: #8d3030;
      color: white;
      width: 100%;
    }

    @media (max-width: 600px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      #logoutBtn {
        width: 100%;
      }

      .panel {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div>
      <h1>🧬 Hubaib Admin</h1>
      <p>Biotechnology Portfolio Management</p>
    </div>

    <button id="logoutBtn">Logout</button>
  </header>

  <main>

    <!-- CERTIFICATES -->

    <section class="panel">
      <h2>Add Certificate</h2>

      <form id="certificateForm">

        <label>
          Certificate Title
          <input type="text" id="title" required>
        </label>

        <label>
          Issuer
          <input type="text" id="issuer">
        </label>

        <label>
          Description
          <textarea id="description"></textarea>
        </label>

        <label>
          Image URL
          <input type="url" id="image_url" placeholder="https://...">
        </label>

        <label>
          Certificate URL
          <input type="url" id="certificate_url" placeholder="https://...">
        </label>

        <label>
          Issue Date
          <input type="date" id="issue_date">
        </label>

        <button type="submit" class="save-btn">
          Save Certificate
        </button>

        <p id="message" class="message"></p>

      </form>
    </section>

    <section class="panel">
      <h2>Saved Certificates</h2>
      <div id="certificateList" class="item-list">
        <p class="muted">Loading certificates...</p>
      </div>
    </section>

    <!-- PROJECTS -->

    <section class="panel">
      <h2>Add Project</h2>

      <form id="projectForm">

        <label>
          Project Title
          <input type="text" id="project_title" required>
        </label>

        <label>
          Description
          <textarea id="project_description" required></textarea>
        </label>

        <label>
          Category
          <input
            type="text"
            id="project_category"
            placeholder="Bioinformatics, Biotechnology, Environment..."
          >
        </label>

        <label>
          Image URL
          <input
            type="url"
            id="project_image_url"
            placeholder="https://..."
          >
        </label>

        <label>
          Project URL
          <input
            type="url"
            id="project_url"
            placeholder="https://..."
          >
        </label>

        <label>
          Technologies
          <input
            type="text"
            id="project_technologies"
            placeholder="HTML, CSS, JavaScript, Python"
          >
        </label>

        <button type="submit" class="save-btn">
          Save Project
        </button>

        <p id="projectMessage" class="message"></p>

      </form>
    </section>

    <section class="panel">
      <h2>Saved Projects</h2>

      <div id="projectList" class="item-list">
        <p class="muted">Loading projects...</p>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://kenpaoyjbicbvsogecmg.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_ftendUcY6moUA8ty4w3dfA_HMEqFD7p";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const certificateForm =
      document.getElementById("certificateForm");

    const certificateList =
      document.getElementById("certificateList");

    const message =
      document.getElementById("message");

    const projectForm =
      document.getElementById("projectForm");

    const projectList =
      document.getElementById("projectList");

    const projectMessage =
      document.getElementById("projectMessage");

    async function checkLogin() {
      const { data } =
        await supabaseClient.auth.getSession();

      if (!data.session) {
        window.location.href = "index.html";
      }
    }

    async function loadCertificates() {
      const { data, error } =
        await supabaseClient
          .from("certificates")
          .select("*")
          .order("created_at", { ascending: false });

      if (error) {
        certificateList.innerHTML =
          "<p>Unable to load certificates.</p>";
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        certificateList.innerHTML =
          '<p class="muted">No certificates added yet.</p>';
        return;
      }

      certificateList.innerHTML = "";

      data.forEach((certificate) => {
        const card = document.createElement("article");
        card.className = "item-card";

        card.innerHTML = `
          ${
            certificate.image_url
              ? `<img src="${certificate.image_url}" alt="${certificate.title}">`
              : ""
          }

          <h3>${certificate.title}</h3>

          <p>${certificate.issuer || ""}</p>

          <p>${certificate.description || ""}</p>

          ${
            certificate.certificate_url
              ? `<a href="${certificate.certificate_url}" target="_blank">
                  View Certificate
                </a>`
              : ""
          }

          <button class="delete-btn">
            Delete
          </button>
        `;

        card.querySelector(".delete-btn")
          .addEventListener("click", () => {
            deleteCertificate(certificate.id);
          });

        certificateList.appendChild(card);
      });
    }

    certificateForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "Saving certificate...";

      const certificate = {
        title: document.getElementById("title").value.trim(),
        issuer: document.getElementById("issuer").value.trim(),
        description: document.getElementById("description").value.trim(),
        image_url: document.getElementById("image_url").value.trim(),
        certificate_url: document
          .getElementById("certificate_url")
          .value.trim(),
        issue_date:
          document.getElementById("issue_date").value || null
      };

      const { error } =
        await supabaseClient
          .from("certificates")
          .insert([certificate]);

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent =
        "Certificate saved successfully.";

      certificateForm.reset();
      loadCertificates();
    });

    async function deleteCertificate(id) {
      if (!confirm("Delete this certificate?")) return;

      const { error } =
        await supabaseClient
          .from("certificates")
          .delete()
          .eq("id", id);

      if (error) {
        alert(error.message);
        return;
      }

      loadCertificates();
    }

    async function loadProjects() {
      const { data, error } =
        await supabaseClient
          .from("projects")
          .select("*")
          .order("created_at", { ascending: false });

      if (error) {
        projectList.innerHTML =
          "<p>Unable to load projects.</p>";
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        projectList.innerHTML =
          '<p class="muted">No projects added yet.</p>';
        return;
      }

      projectList.innerHTML = "";

      data.forEach((project) => {
        const card = document.createElement("article");
        card.className = "item-card";

        card.innerHTML = `
          ${
            project.image_url
              ? `<img src="${project.image_url}" alt="${project.title}">`
              : ""
          }

          <h3>${project.title}</h3>

          <p>${project.category || ""}</p>

          <p>${project.description || ""}</p>

          <p>
            <strong>Technologies:</strong>
            ${project.technologies || ""}
          </p>

          ${
            project.project_url
              ? `<a href="${project.project_url}" target="_blank">
                  View Project
                </a>`
              : ""
          }

          <button class="delete-btn">
            Delete
          </button>
        `;

        card.querySelector(".delete-btn")
          .addEventListener("click", () => {
            deleteProject(project.id);
          });

        projectList.appendChild(card);
      });
    }

    projectForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      projectMessage.textContent =
        "Saving project...";

      const project = {
        title: document
          .getElementById("project_title")
          .value.trim(),

        description: document
          .getElementById("project_description")
          .value.trim(),

        category: document
          .getElementById("project_category")
          .value.trim(),

        image_url: document
          .getElementById("project_image_url")
          .value.trim(),

        project_url: document
          .getElementById("project_url")
          .value.trim(),

        technologies: document
          .getElementById("project_technologies")
          .value.trim()
      };

      const { error } =
        await supabaseClient
          .from("projects")
          .insert([project]);

      if (error) {
        projectMessage.textContent =
          error.message;
        return;
      }

      projectMessage.textContent =
        "Project saved successfully.";

      projectForm.reset();
      loadProjects();
    });

    async function deleteProject(id) {
      if (!confirm("Delete this project?")) return;

      const { error } =
        await supabaseClient
          .from("projects")
          .delete()
          .eq("id", id);

      if (error) {
        alert(error.message);
        return;
      }

      loadProjects();
    }

    document
      .getElementById("logoutBtn")
      .addEventListener("click", async () => {
        await supabaseClient.auth.signOut();
        window.location.href = "index.html";
      });

    checkLogin();
    loadCertificates();
    loadProjects();
  </script>

</body>
</html>
